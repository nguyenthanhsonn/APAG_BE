global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: apag-backend
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: [host.docker.internal:5050, host.docker.internal:5051]
