services:
  - type: pserv
    name: apag-api
    runtime: docker
    region: singapore
    plan: starter
    numInstances: 1
    rootDir: projects
    preDeployCommand: pnpm db:deploy
    dockerCommand: node dist/main.js
    envVars:
      - key: PORT
        value: '5050'
      - key: BACKEND_PORT
        value: '5050'
      - key: BACKEND_HOST
        value: '0.0.0.0'
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: METRICS_ENABLED
        value: 'false'
      - key: SWAGGER_ENABLED
        value: 'false'

  - type: web
    name: apag-nginx
    runtime: docker
    region: singapore
    plan: starter
    rootDir: projects/infra/nginx
    healthCheckPath: /api/v1/health
    envVars:
      - key: APAG_UPSTREAM_HOST
        fromService:
          name: apag-api
          type: pserv
          property: host
